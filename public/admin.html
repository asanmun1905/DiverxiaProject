<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Diverxia</title>
    <link rel="icon" href="img/Favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('role') !== 'admin') {
            alert('Acceso denegado. Debes iniciar sesión como administrador.');
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <div class="bg-geometry">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header>
        <div class="logo">
            <a href="index.html"><img src="img/Recurso-1.svg" alt="Diverxia Logo"></a>
        </div>
        <div class="hamburger" id="hamburger-header">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="hamburger active" id="hamburger-sidebar">
                <span></span><span></span><span></span>
            </div>
        </div>
        <a href="index.html">Inicio</a>
        <a href="roles.html">Comenzar</a>
        <a href="invitados.html" class="nav-participantes" style="display: none;">Panel Participantes</a>
        <a href="admin.html" class="nav-admin" style="display: none;">Panel Administrador</a>
        <a href="jueces.html" class="nav-jueces" style="display: none;">Panel Jueces</a>
        <a href="https://www.diverxiaconsulting.com" target="_blank">Sobre Nosotros</a>
        <a href="#" class="nav-logout" style="display: none;">Cerrar sesión</a>
    </nav>

    <main style="align-items: center; justify-content: flex-start; padding-top: 30px;">
        <div class="events-wrapper">
            <div class="events-header">
                <div>
                    <h1>Gestión de <span>Eventos</span></h1>
                    <p class="subtitle" style="margin-bottom: 0; margin-top: 8px;">Administra, reordena y elimina eventos del sistema.</p>
                </div>

                <div class="filter-bar" style="margin-top: 20px;">
                    <button class="filter-btn active" data-sort="order" id="btn-order">
                        Orden <span class="arrow">↕</span>
                    </button>
                    <button class="filter-btn" data-sort="date-asc" id="btn-date-asc">
                        Fecha <span class="arrow">↑</span>
                    </button>
                    <button class="filter-btn" data-sort="date-desc" id="btn-date-desc">
                        Fecha <span class="arrow">↓</span>
                    </button>
                    <button class="filter-btn" data-sort="name-asc" id="btn-name-asc">
                        Nombre <span class="arrow">↑</span>
                    </button>
                    <button class="filter-btn" data-sort="name-desc" id="btn-name-desc">
                        Nombre <span class="arrow">↓</span>
                    </button>

                    <button class="btn-primary" id="btn-nuevo-evento" style="padding: 7px 14px; margin-left: 10px;">
                        + Nuevo Evento
                    </button>

                    <button class="btn-danger" id="bulk-delete-btn" style="display: none; padding: 7px 14px;">
                        <img src="img/botonborrar.png" alt="Eliminar"> Borrar
                    </button>
                </div>
            </div>

            <div class="events-list" id="admin-events-list">
                <!-- Rendered by JS -->
            </div>
        </div>
    </main>

    <!-- Modal confirmación -->
    <dialog id="confirm-modal">
        <h2 id="modal-title"></h2>
        <p id="modal-body"></p>
        <div style="display:flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
            <button id="modal-cancel" class="filter-btn">Cancelar</button>
            <button id="modal-confirm" class="btn-danger">Confirmar</button>
        </div>
    </dialog>

    <!-- Modal nuevo/editar evento -->
    <dialog id="event-modal">
        <h2 id="event-modal-title">Nuevo Evento</h2>
        <div style="margin-top: 10px;">
            <input type="hidden" id="event-modal-id">
            
            <div class="form-group">
                <label class="form-label" for="event-modal-nombre">Nombre</label>
                <input type="text" id="event-modal-nombre" class="form-input" placeholder="Nombre del evento">
            </div>

            <div class="form-group">
                <label class="form-label" for="event-modal-descripcion">Descripción</label>
                <textarea id="event-modal-descripcion" class="form-input" placeholder="Descripción (opcional)" rows="3" style="min-height: 80px; resize: vertical;"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="event-modal-fecha">Inicio</label>
                    <input type="date" id="event-modal-fecha" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label" for="event-modal-fecha-fin">Fin (Opcional)</label>
                    <input type="date" id="event-modal-fecha-fin" class="form-input">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="event-modal-estado">Estado</label>
                <select id="event-modal-estado" class="form-input">
                    <option value="abierto">Abierto</option>
                    <option value="cerrado">Cerrado</option>
                    <option value="finalizado">Finalizado</option>
                </select>
            </div>

            <!-- Número de jueces (visible siempre, editable en crear y editar) -->
            <div class="form-group">
                <label class="form-label" for="event-modal-jueces">Nº Jueces (max 10)</label>
                <input type="number" id="event-modal-jueces" class="form-input" min="1" max="10" value="5">
            </div>

            <!-- Inicialización de pruebas y equipos (solo para nuevos eventos) -->
            <div id="event-modal-init-fields" class="form-row">
                <div class="form-group">
                    <label class="form-label" for="event-modal-pruebas">Nº Pruebas (max 10)</label>
                    <input type="number" id="event-modal-pruebas" class="form-input" min="1" max="10" value="5">
                </div>

                <div class="form-group">
                    <label class="form-label" for="event-modal-equipos">Nº Equipos (max 16)</label>
                    <input type="number" id="event-modal-equipos" class="form-input" min="1" max="16" value="8">
                </div>
            </div>
        </div>
        <div class="modal-actions">
            <button id="event-modal-cancel" class="filter-btn">Cancelar</button>
            <button id="event-modal-save" class="btn-primary">Guardar</button>
        </div>
    </dialog>

    <footer>
        © 2026 Diverxia Consulting
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="script.js"></script>
    <script type="module">
        import { supabase, fetchUserMap } from './supabase-config.js';

        const listEl          = document.getElementById('admin-events-list');
        const bulkDeleteBtn   = document.getElementById('bulk-delete-btn');
        const confirmModal    = document.getElementById('confirm-modal');
        const eventModal      = document.getElementById('event-modal');

        let events = [];
        let currentSort = 'order';
        let confirmActionCb = null;

        // ── Confirm Modal ─────────────────────────────────────────────────────
        document.getElementById('modal-cancel').addEventListener('click', () => {
            confirmModal.close();
            confirmActionCb = null;
        });
        document.getElementById('modal-confirm').addEventListener('click', () => {
            if (confirmActionCb) confirmActionCb();
            confirmModal.close();
        });
        function showConfirm(title, body, callback) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').textContent = body;
            confirmActionCb = callback;
            confirmModal.showModal();
        }

        // ── Event Modal ───────────────────────────────────────────────────────
        // ── Event Modal ───────────────────────────────────────────────────────
        document.getElementById('btn-nuevo-evento').addEventListener('click', () => {
            document.getElementById('event-modal-title').textContent = 'Nuevo Evento';
            document.getElementById('event-modal-id').value = '';
            document.getElementById('event-modal-nombre').value = '';
            document.getElementById('event-modal-descripcion').value = '';
            document.getElementById('event-modal-fecha').value = '';
            document.getElementById('event-modal-fecha-fin').value = '';
            document.getElementById('event-modal-estado').value = 'abierto';
            document.getElementById('event-modal-jueces').value = '5';
            document.getElementById('event-modal-pruebas').value = '5';
            document.getElementById('event-modal-equipos').value = '8';
            document.getElementById('event-modal-init-fields').style.display = 'grid';
            eventModal.showModal();
        });

        document.getElementById('event-modal-cancel').addEventListener('click', () => {
            eventModal.close();
        });

        document.getElementById('event-modal-save').addEventListener('click', async () => {
            const id        = document.getElementById('event-modal-id').value;
            const nombre    = document.getElementById('event-modal-nombre').value.trim();
            const desc      = document.getElementById('event-modal-descripcion').value.trim();
            const fecha     = document.getElementById('event-modal-fecha').value;
            const fecha_fin = document.getElementById('event-modal-fecha-fin').value || null;
            const estado    = document.getElementById('event-modal-estado').value;
            const num_jueces = Math.min(10, Math.max(1, parseInt(document.getElementById('event-modal-jueces').value) || 5));

            if (!nombre || !fecha) {
                alert('El nombre y la fecha de inicio son obligatorios.');
                return;
            }

            const payload = { nombre, descripcion: desc, fecha, fecha_fin, estado, num_jueces };

            if (id) {
                // Editar
                const { error } = await supabase
                    .from('eventos')
                    .update(payload)
                    .eq('id', id);
                if (error) { console.error(error); return; }
            } else {
                // Crear
                const newOrder = events.length;
                const { data, error } = await supabase
                    .from('eventos')
                    .insert({ ...payload, display_order: newOrder })
                    .select();
                if (error) { console.error(error); return; }

                if (data && data.length > 0) {
                    const newEvent = data[0];
                    
                    // Insertar Pruebas
                    const numPruebas = Math.min(10, Math.max(1, parseInt(document.getElementById('event-modal-pruebas').value) || 5));
                    const trialsToInsert = [];
                    for (let i = 1; i <= numPruebas; i++) {
                        trialsToInsert.push({ evento_id: newEvent.id, nombre: `Prueba ${i}` });
                    }
                    const { data: insertedTrials, error: errPruebas } = await supabase.from('pruebas').insert(trialsToInsert).select();
                    if (errPruebas) console.error('Error al insertar pruebas:', errPruebas);

                    // Insertar bloqueos para pruebas 2 en adelante por defecto
                    const { data: { user } } = await supabase.auth.getUser();
                    let adminUuid = user ? user.id : null;
                    if (!adminUuid) {
                        const userMap = await fetchUserMap();
                        adminUuid = userMap['admin'];
                    }
                    if (insertedTrials && insertedTrials.length > 1 && adminUuid) {
                        insertedTrials.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
                        const blocksToInsert = [];
                        for (let i = 1; i < insertedTrials.length; i++) {
                            blocksToInsert.push({
                                equipo_id: null,
                                prueba_id: insertedTrials[i].id,
                                de_usuario: adminUuid,
                                tipo: 'juez',
                                valor: 5
                            });
                        }
                        const { error: errBlocks } = await supabase.from('puntuaciones').insert(blocksToInsert);
                        if (errBlocks) console.error('Error al insertar bloqueos por defecto:', errBlocks);
                    }

                    // Insertar Equipos
                    const numEquipos = Math.min(16, Math.max(1, parseInt(document.getElementById('event-modal-equipos').value) || 8));
                    const teamsToInsert = [];
                    for (let i = 1; i <= numEquipos; i++) {
                        teamsToInsert.push({ evento_id: newEvent.id, nombre: `Equipo ${i}` });
                    }
                    const { error: errEquipos } = await supabase.from('equipos').insert(teamsToInsert);
                    if (errEquipos) console.error('Error al insertar equipos:', errEquipos);
                }
            }

            eventModal.close();
            await loadEvents();
        });

        function openEditModal(ev) {
            document.getElementById('event-modal-title').textContent = 'Editar Evento';
            document.getElementById('event-modal-id').value = ev.id;
            document.getElementById('event-modal-nombre').value = ev.nombre;
            document.getElementById('event-modal-descripcion').value = ev.descripcion || '';
            document.getElementById('event-modal-fecha').value = ev.fecha;
            document.getElementById('event-modal-fecha-fin').value = ev.fecha_fin || '';
            document.getElementById('event-modal-estado').value = ev.estado || 'abierto';
            document.getElementById('event-modal-jueces').value = ev.num_jueces ?? 5;
            document.getElementById('event-modal-init-fields').style.display = 'none';
            eventModal.showModal();
        }

        // ── Data ──────────────────────────────────────────────────────────────
        async function loadEvents() {
            const { data, error } = await supabase
                .from('eventos')
                .select('*')
                .order('display_order', { ascending: true });
            if (error) { console.error(error); return; }
            events = data;
            renderAdminEvents();
        }

        async function saveOrder() {
            const updates = events.map((ev, idx) =>
                supabase.from('eventos').update({ display_order: idx }).eq('id', ev.id)
            );
            await Promise.all(updates);
        }

        async function deleteSingle(id) {
            showConfirm('Borrar Evento', '¿Borrar este evento permanentemente?', async () => {
                const { error } = await supabase.from('eventos').delete().eq('id', id);
                if (error) { console.error(error); return; }
                await loadEvents();
            });
        }

        // ── Helpers ───────────────────────────────────────────────────────────
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        function parseDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDate(inicio, fin) {
            const d1 = parseDate(inicio);
            const s1 = d1.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
            
            if (!fin || fin === inicio) {
                return d1.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
            }

            const d2 = parseDate(fin);
            const s2 = d2.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
            
            // Si es el mismo mes, podemos abreviar un poco más si queremos, pero así es seguro
            return `${s1} - ${s2}`;
        }

        function getStatus(inicio, fin) {
            const fStart = parseDate(inicio);
            const fEnd   = fin ? parseDate(fin) : fStart;

            if (today < fStart) return 'upcoming';
            if (today > fEnd)   return 'past';
            return 'active';
        }

        function statusLabel(status) {
            if (status === 'past')   return { label: 'Finalizado', cls: 'past-status' };
            if (status === 'active') return { label: '● En curso', cls: 'active-status' };
            return { label: 'Próximo', cls: 'upcoming-status' };
        }

        function parseChecked() {
            const boxes = document.querySelectorAll('.card-checkbox:checked');
            if (boxes.length > 0) {
                bulkDeleteBtn.style.display = 'inline-flex';
                bulkDeleteBtn.innerHTML = `<img src="img/botonborrar.png" alt="Eliminar"> Borrar (${boxes.length})`;
            } else {
                bulkDeleteBtn.style.display = 'none';
            }
        }

        bulkDeleteBtn.addEventListener('click', () => {
            const boxes = document.querySelectorAll('.card-checkbox:checked');
            const ids = Array.from(boxes).map(b => b.dataset.id);
            if (!ids.length) return;
            showConfirm('Borrado Masivo', `Se eliminarán ${ids.length} eventos. ¿Estás seguro?`, async () => {
                const { error } = await supabase.from('eventos').delete().in('id', ids);
                if (error) { console.error(error); return; }
                bulkDeleteBtn.style.display = 'none';
                await loadEvents();
            });
        });

        // ── Render ────────────────────────────────────────────────────────────
        function renderAdminEvents() {
            listEl.innerHTML = '';

            let sorted = [...events];
            if (currentSort === 'date-asc')  sorted.sort((a,b) => parseDate(a.fecha) - parseDate(b.fecha));
            if (currentSort === 'date-desc') sorted.sort((a,b) => parseDate(b.fecha) - parseDate(a.fecha));
            if (currentSort === 'name-asc')  sorted.sort((a,b) => a.nombre.localeCompare(b.nombre, 'es'));
            if (currentSort === 'name-desc') sorted.sort((a,b) => b.nombre.localeCompare(a.nombre, 'es'));
            // 'order' usa el orden ya cargado de display_order

            if (sorted.length === 0) {
                listEl.innerHTML = '<div class="no-results">No se encontraron eventos.</div>';
                return;
            }

            sorted.forEach((ev, idx) => {
                const status = getStatus(ev.fecha, ev.fecha_fin);
                const sl = statusLabel(status);

                const card = document.createElement('div');
                card.className = `event-card${status === 'past' ? ' past' : ''}`;
                card.dataset.id = ev.id;
                card.dataset.index = idx;

                card.innerHTML = `
                    <input type="checkbox" class="card-checkbox" data-id="${ev.id}">
                    <div class="event-info">
                        <div class="event-title">${ev.nombre}</div>
                        <div class="event-category">${ev.descripcion || ''}</div>
                    </div>
                    <div class="event-dates">
                        <div class="event-date-range">${formatDate(ev.fecha, ev.fecha_fin)}</div>
                        <div class="event-status ${sl.cls}">${sl.label}</div>
                    </div>
                    <div class="event-actions">
                        <button class="btn-edit-icon" aria-label="Editar Evento" data-idx="${idx}">
                            <img src="img/wmremove-transformed-removebg-preview.png" alt="Editar">
                        </button>
                        <button class="btn-delete-icon" onclick="window._deleteEvento('${ev.id}')" aria-label="Borrar Evento">
                            <img src="img/botonborrar.png" alt="Borrar">
                        </button>
                    </div>
                    <div class="drag-handle" style="cursor: grab;">
                        <svg width="18" height="24" viewBox="0 0 24 24" fill="currentColor" opacity="0.6" style="pointer-events: none;">
                            <circle cx="9" cy="5" r="2"/><circle cx="15" cy="5" r="2"/>
                            <circle cx="9" cy="12" r="2"/><circle cx="15" cy="12" r="2"/>
                            <circle cx="9" cy="19" r="2"/><circle cx="15" cy="19" r="2"/>
                        </svg>
                    </div>
                `;

                // Configurar cursor pointer si el evento está activo
                const isEventActive = ev.estado === 'abierto' || status === 'active';
                if (isEventActive) {
                    card.style.cursor = 'pointer';
                }

                card.addEventListener('click', (e) => {
                    // Evitar la navegación si se hace click en controles
                    if (e.target.closest('.card-checkbox') || e.target.closest('button') || e.target.closest('.drag-handle')) {
                        return;
                    }
                    if (isEventActive) {
                        window.location.href = `detalle-evento.html?id=${ev.id}`;
                    } else {
                        alert('Este evento no está activo. Solo puedes entrar en eventos activos.');
                    }
                });

                card.querySelector('.btn-edit-icon').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditModal(sorted[idx]);
                });
                listEl.appendChild(card);
            });

            document.querySelectorAll('.card-checkbox').forEach(cb => {
                cb.addEventListener('change', parseChecked);
            });
            parseChecked();
            initSortable();
        }

        function initSortable() {
            if (currentSort !== 'order') return; // Solo permitir drag si estamos en modo orden personalizado

            Sortable.create(listEl, {
                animation: 250,
                handle: '.drag-handle', // Solo arrastrar por el handle
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                forceFallback: true, // Forzar fallback para que se vea mejor el "agarrado"
                fallbackOnBody: true,
                fallbackTolerance: 3, // Evita disparar el drag por error al hacer click
                swapThreshold: 0.65,
                onEnd: async function () {
                    // Obtener nuevo orden de los IDs
                    const newOrderIds = Array.from(listEl.querySelectorAll('.event-card')).map(card => card.dataset.id);
                    
                    // Actualizar array local 'events' para reflejar el cambio
                    const reorderedEvents = [];
                    newOrderIds.forEach(id => {
                        const ev = events.find(e => e.id === id);
                        if (ev) reorderedEvents.push(ev);
                    });
                    events = reorderedEvents;

                    // Persistir en Supabase
                    await saveOrder();
                }
            });
        }

        // Exponer deleteSingle globalmente para el onclick inline
        window._deleteEvento = deleteSingle;

        // ── Sort buttons ──────────────────────────────────────────────────────
        document.querySelectorAll('.filter-btn[data-sort]').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSort = btn.dataset.sort;
                document.querySelectorAll('.filter-btn[data-sort]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderAdminEvents();
            });
        });

        loadEvents();
    </script>
</body>
</html>
