<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Diverxia - Inicio</title>
    <link rel="icon" href="img/Favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script>
        // Limpiar sesión ANTES de cargar cualquier script para evitar que el sidebar muestre enlaces de sesiones anteriores
        localStorage.removeItem('role');
        localStorage.removeItem('judge_code');
    </script>
</head>
<body>
    <div class="bg-geometry">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header>
        <div class="logo">
            <a href="index.html"><img src="img/Recurso-1.svg" alt="Diverxia Logo"></a>
        </div>
        <div class="hamburger" id="hamburger-header">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="hamburger active" id="hamburger-sidebar">
                <span></span><span></span><span></span>
            </div>
        </div>
        <a href="index.html">Inicio</a>
        <a href="roles.html">Comenzar</a>
        <a href="invitados.html" class="nav-invitados" style="display: none;">Panel Invitados</a>
        <a href="jueces.html" class="nav-jueces" style="display: none;">Panel Jueces</a>
        <a href="https://www.diverxiaconsulting.com" target="_blank">Sobre Nosotros</a>
        <a href="#" class="nav-logout" style="display: none;">Cerrar sesión</a>
    </nav>

    <main>
        <div class="container login-container" style="max-width: 450px;">
            <h1>Iniciar <span>Sesión</span></h1>
            <p class="subtitle">Inicia sesión de forma segura para comenzar.</p>
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="usuario@diverxia.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña de acceso" required>
                </div>
                <p id="login-error-msg" style="color: #ff5555; font-size: 0.9rem; margin-top: 10px; display: none; text-align: center;"></p>
                <button type="submit" class="btn">Ingresar al Panel</button>
            </form>
        </div>
    </main>

    <footer>
        © 2026 Diverxia Consulting
    </footer>

    <script src="script.js"></script>
    <script type="module">
        import { supabase } from './supabase-config.js';

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('login-error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Iniciar sesión con Supabase Auth
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                errorMsg.textContent = 'Error de inicio de sesión: ' + error.message;
                errorMsg.style.display = 'block';
                return;
            }

            // Comprobar si el usuario tiene rol de admin en la tabla de usuarios
            const userId = data.user.id;
            const { data: userDb, error: dbError } = await supabase
                .from('usuarios')
                .select('rol')
                .eq('id', userId)
                .single();

            if (dbError || !userDb || userDb.rol !== 'admin') {
                // Cerrar sesión si no es admin
                await supabase.auth.signOut();
                errorMsg.textContent = 'Acceso denegado. No tienes permisos de administrador.';
                errorMsg.style.display = 'block';
                return;
            }

            // Guardar rol y redirigir
            localStorage.setItem('role', 'admin');
            window.location.href = 'admin.html';
        });
    </script>
</body>
</html>
