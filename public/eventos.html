<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Diverxia</title>
    <link rel="icon" href="img/Favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script>
        const role = localStorage.getItem('role');
        if (!role) {
            alert('Acceso denegado. Por favor, selecciona tu rol.');
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <div class="bg-geometry">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header>
        <div class="logo">
            <a href="index.html"><img src="img/Recurso-1.svg" alt="Diverxia Logo"></a>
        </div>
        <div class="hamburger" id="hamburger-header">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="hamburger active" id="hamburger-sidebar">
                <span></span><span></span><span></span>
            </div>
        </div>
        <a href="index.html">Inicio</a>
        <a href="roles.html">Comenzar</a>
        <a href="invitados.html" class="nav-invitados" style="display: none;">Panel Invitados</a>
        <a href="admin.html" class="nav-admin" style="display: none;">Panel Administrador</a>
        <a href="jueces.html" class="nav-jueces" style="display: none;">Panel Jueces</a>
        <a href="https://www.diverxiaconsulting.com" target="_blank">Sobre Nosotros</a>
        <a href="#" class="nav-logout" style="display: none;">Cerrar sesión</a>
    </nav>

    <main style="align-items: center; justify-content: flex-start; padding-top: 30px;">
        <div class="events-wrapper">
            <div class="events-header">
                <div>
                    <h1>Listado de <span>Eventos</span></h1>
                    <p class="subtitle" style="margin-bottom: 0; margin-top: 8px;">Explora todas las pruebas del evento.</p>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn" data-sort="date-asc" id="btn-date-asc">
                        Fecha <span class="arrow">↑</span>
                    </button>
                    <button class="filter-btn active" data-sort="date-desc" id="btn-date-desc">
                        Fecha <span class="arrow">↓</span>
                    </button>
                    <button class="filter-btn" data-sort="name-asc" id="btn-name-asc">
                        Nombre <span class="arrow">↑</span>
                    </button>
                    <button class="filter-btn" data-sort="name-desc" id="btn-name-desc">
                        Nombre <span class="arrow">↓</span>
                    </button>
                </div>
            </div>

            <div class="events-list" id="events-list">
                <!-- Rendered by JS -->
            </div>
        </div>
    </main>

    <!-- Modal para selección de equipo por Invitados -->
    <dialog id="guest-team-modal">
        <h2 id="guest-team-modal-title">Selecciona tu Equipo</h2>
        <p class="subtitle" style="margin-top: 5px; margin-bottom: 20px; font-size: 0.9rem; text-align: left;">Elige el equipo al que perteneces para unirte al evento.</p>
        
        <div id="guest-teams-container" style="max-height: 350px; overflow-y: auto; margin-bottom: 20px; padding-right: 5px; display: flex; flex-direction: column; gap: 10px;">
            <!-- Rendered dynamically by JS -->
            <div style="text-align: center; color: var(--primary); padding: 20px;">Cargando equipos...</div>
        </div>
        
        <div class="modal-actions" style="justify-content: flex-end; margin-top: 20px;">
            <button id="guest-team-cancel" class="filter-btn">Cancelar</button>
        </div>
    </dialog>

    <footer>
        © 2026 Diverxia Consulting
    </footer>

    <script src="script.js"></script>
    <script type="module">
        import { supabase } from './supabase-config.js';

        let events = [];

        async function fetchEvents() {
            const { data, error } = await supabase
                .from('eventos')
                .select('*')
                .order('display_order', { ascending: true });

            if (error) {
                console.error('Error cargando eventos:', error.message);
                return;
            }
            
            const userRole = localStorage.getItem('role');
            if (userRole === 'invitado' || userRole === 'juez') {
                events = data.filter(ev => ev.estado === 'abierto');
            } else {
                events = data;
            }
            renderEvents();
        }

        // Funciones auxiliares
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        function parseDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatDate(str) {
            const d = parseDate(str);
            return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function getStatus(fecha) {
            const f = parseDate(fecha);
            if (f < today) return 'past';
            if (f.toDateString() === today.toDateString()) return 'active';
            return 'upcoming';
        }

        function statusLabel(status) {
            if (status === 'past')   return { label: 'Finalizado', cls: 'past-status' };
            if (status === 'active') return { label: '● En curso', cls: 'active-status' };
            return { label: 'Próximo', cls: 'upcoming-status' };
        }

        // Renderizado de eventos
        let currentSort = 'date-desc';

        function renderEvents() {
            const list = document.getElementById('events-list');
            const sorted = [...events].sort((a, b) => {
                if (currentSort === 'date-asc')  return parseDate(a.fecha) - parseDate(b.fecha);
                if (currentSort === 'date-desc') return parseDate(b.fecha) - parseDate(a.fecha);
                if (currentSort === 'name-asc')  return a.nombre.localeCompare(b.nombre, 'es');
                if (currentSort === 'name-desc') return b.nombre.localeCompare(a.nombre, 'es');
                return 0;
            });

            list.innerHTML = '';

            if (sorted.length === 0) {
                list.innerHTML = '<div class="no-results">No hay eventos disponibles.</div>';
                return;
            }

            sorted.forEach(ev => {
                const status = getStatus(ev.fecha);
                const sl = statusLabel(status);

                const card = document.createElement('div');
                card.className = `event-card${status === 'past' ? ' past' : ''}`;
                card.innerHTML = `
                    <div class="event-info">
                        <div class="event-title">${ev.nombre}</div>
                        <div class="event-category">${ev.descripcion || ''}</div>
                    </div>
                    <div class="event-dates">
                        <div class="event-date-range">${formatDate(ev.fecha)}</div>
                        <div class="event-status ${sl.cls}">${sl.label}</div>
                    </div>
                `;

                // Configurar click
                const userRole = localStorage.getItem('role');
                const isEventActive = ev.estado === 'abierto';

                if (userRole === 'admin') {
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', () => {
                        window.location.href = `detalle-evento.html?id=${ev.id}`;
                    });
                } else if (userRole === 'juez') {
                    if (isEventActive) {
                        card.style.cursor = 'pointer';
                        card.addEventListener('click', () => {
                            window.location.href = `detalle-evento.html?id=${ev.id}`;
                        });
                    } else {
                        card.style.opacity = '0.5';
                        card.style.cursor = 'not-allowed';
                        card.addEventListener('click', () => {
                            alert('Este evento no está en curso. Solo se puede entrar en eventos en curso.');
                        });
                    }
                } else if (userRole === 'invitado') {
                    if (isEventActive) {
                        card.style.cursor = 'pointer';
                        card.addEventListener('click', () => {
                            const joinedTeam = localStorage.getItem(`joined_team_${ev.id}`);
                            if (joinedTeam) {
                                window.location.href = `detalle-evento.html?id=${ev.id}`;
                            } else {
                                openGuestTeamModal(ev);
                            }
                        });
                    } else {
                        card.style.opacity = '0.5';
                        card.style.cursor = 'not-allowed';
                        card.addEventListener('click', () => {
                            alert('Este evento no está en curso. Solo se puede entrar en eventos en curso.');
                        });
                    }
                }
                list.appendChild(card);
            });
        }

        // Selección de equipo para invitados
        const guestTeamModal = document.getElementById('guest-team-modal');
        const guestTeamsContainer = document.getElementById('guest-teams-container');
        const guestTeamCancel = document.getElementById('guest-team-cancel');

        if (guestTeamCancel && guestTeamModal) {
            guestTeamCancel.addEventListener('click', () => {
                guestTeamModal.close();
            });
        }

        async function openGuestTeamModal(ev) {
            document.getElementById('guest-team-modal-title').innerHTML = `Unirse a <span>${ev.nombre}</span>`;
            guestTeamsContainer.innerHTML = '<div style="text-align: center; color: var(--primary); padding: 20px;">Cargando equipos...</div>';
            guestTeamModal.showModal();

            const { data: teams, error } = await supabase
                .from('equipos')
                .select('*')
                .eq('evento_id', ev.id)
                .order('nombre', { ascending: true });

            if (error) {
                console.error('Error cargando equipos:', error);
                guestTeamsContainer.innerHTML = '<div style="text-align: center; color: #ff5555; padding: 20px;">Error al cargar equipos.</div>';
                return;
            }

            guestTeamsContainer.innerHTML = '';
            if (teams.length === 0) {
                guestTeamsContainer.innerHTML = '<div style="text-align: center; color: var(--primary); padding: 20px;">No hay equipos en este evento.</div>';
                return;
            }

            teams.forEach(team => {
                // Generar conteo estable e interactivo de participantes basado en hash del id
                const hashInput = team.id.replace(/-/g, '').substring(0, 4);
                const baseCount = (parseInt(hashInput, 16) % 5) + 3;

                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.style.background = 'rgba(255, 255, 255, 0.03)';
                item.style.border = '1px solid rgba(255, 255, 255, 0.08)';
                item.style.borderRadius = '10px';
                item.style.padding = '12px 20px';
                item.style.transition = 'all 0.3s ease';

                item.innerHTML = `
                    <div style="display: flex; flex-direction: column;">
                        <span style="font-weight: 600; font-size: 1.05rem; color: #ffffff;">${team.nombre}</span>
                        <span style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.5);">Participantes: ${baseCount}</span>
                    </div>
                    <button class="btn-primary join-team-btn" style="padding: 6px 15px; font-size: 0.9rem; width: auto; margin: 0; border-radius: 6px; cursor: pointer;">Unirse</button>
                `;

                // Hover animado
                item.addEventListener('mouseenter', () => {
                    item.style.background = 'rgba(255, 255, 255, 0.08)';
                    item.style.borderColor = 'rgba(49, 183, 219, 0.4)';
                    item.style.boxShadow = '0 0 10px rgba(49, 183, 219, 0.15)';
                });
                item.addEventListener('mouseleave', () => {
                    item.style.background = 'rgba(255, 255, 255, 0.03)';
                    item.style.borderColor = 'rgba(255, 255, 255, 0.08)';
                    item.style.boxShadow = 'none';
                });

                // Unirse
                item.querySelector('.join-team-btn').addEventListener('click', () => {
                    localStorage.setItem(`joined_team_${ev.id}`, team.id);
                    guestTeamModal.close();
                    window.location.href = `detalle-evento.html?id=${ev.id}`;
                });

                guestTeamsContainer.appendChild(item);
            });
        }

        // Control de ordenación
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentSort = btn.dataset.sort;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderEvents();
            });
        });

        fetchEvents();
    </script>
</body>
</html>
