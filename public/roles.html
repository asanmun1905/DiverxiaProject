<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona Rol - Diverxia</title>
    <link rel="icon" href="img/Favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-geometry">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header>
        <div class="logo">
            <a href="index.html"><img src="img/Recurso-1.svg" alt="Diverxia Logo"></a>
        </div>
        <div class="hamburger" id="hamburger-header">
            <span></span><span></span><span></span>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="hamburger active" id="hamburger-sidebar">
                <span></span><span></span><span></span>
            </div>
        </div>
        <a href="index.html">Inicio</a>
        <a href="roles.html">Comenzar</a>
        <a href="invitados.html" class="nav-participantes" style="display: none;">Panel Participantes</a>
        <a href="admin.html" class="nav-admin" style="display: none;">Panel Administrador</a>
        <a href="jueces.html" class="nav-jueces" style="display: none;">Panel Jueces</a>
        <a href="https://www.diverxiaconsulting.com" target="_blank">Sobre Nosotros</a>
        <a href="#" class="nav-logout" style="display: none;">Cerrar sesión</a>
    </nav>

    <main>
        <div class="container" style="max-width: 800px;">
            <h1>Selecciona tu <span>Rol</span></h1>
            <p class="subtitle">Elige como quieres participar en el evento.</p>
            
            <div class="roles-grid">
                <a href="#" class="role-card" id="btn-jueces-login">Jueces</a>
                <a href="eventos.html" class="role-card" id="btn-participantes-login">Participantes</a>
            </div>
        </div>
    </main>

    <!-- Modal para código de juez -->
    <dialog id="judge-code-modal">
        <h2>Acceso Jueces</h2>
        <div style="margin-top: 10px;">
            <div class="form-group" style="text-align: left;">
                <label class="form-label" for="judge-code-input">Código de Juez</label>
                <input type="text" id="judge-code-input" class="form-input" style="text-transform: uppercase;">
                <p id="judge-code-error" style="color: #ff5555; font-size: 0.85rem; margin-top: 5px; display: none;">Código de juez incorrecto. Introduce un código válido.</p>
            </div>
        </div>
        <div class="modal-actions">
            <button id="judge-code-cancel" class="filter-btn">Cancelar</button>
            <button id="judge-code-submit" class="btn-primary" style="padding: 10px 20px;">Entrar</button>
        </div>
    </dialog>

    <footer>
        © 2026 Diverxia Consulting
    </footer>

    <script src="script.js"></script>
</body>
</html>
